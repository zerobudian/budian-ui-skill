name: budian-ui

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JS syntax
        run: node --check examples/assets/budian.js
      - name: tokens.json valid
        run: python3 -c "import json;json.load(open('tokens/tokens.json'));print('tokens.json OK')"
      - name: Static suite
        run: python3 .github/workflows/_static.py
      - name: Runtime smoke (jsdom)
        run: |
          npm install --no-audit --no-fund jsdom
          node .github/workflows/_runtime.js